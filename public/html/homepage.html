<!-- HOMEPAGE.HTML ACTUALIZAT cu User Dropdown -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Platform</title>
    <link rel="stylesheet" href="../css/homepage.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Main Dashboard -->
    <div id="dashboard" class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="logo">
                <img src="../assets/logo.png" alt="Logo">
            </div>
            
            <button class="sidebar-icon active">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M21 6H3C2.45 6 2 6.45 2 7V17C2 17.55 2.45 18 3 18H21C21.55 18 22 17.55 22 17V7C22 6.45 21.55 6 21 6Z" stroke="currentColor" fill="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M6 11H8" stroke="#1A1C24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M7 10V12" stroke="#1A1C24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                  <circle cx="17" cy="11" r="1" fill="#1A1C24"/>
                  <circle cx="15" cy="13" r="1" fill="#1A1C24"/>
                </svg>
              </button>
              
              <!-- Iconița pentru Grafic Statistică (A doua) -->
              <button class="sidebar-icon" onclick="window.location.href='leaderboard.html'">
                <?xml version="1.0" ?><svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><title/><g data-name="Layer 2" id="Layer_2"><path d="M18,3V2H6V3a4,4,0,1,0,0,8h.81A6,6,0,0,0,11,13.91V16H7.22l-1.5,6H18.28l-1.5-6H13V13.91A6,6,0,0,0,17.19,11H18a4,4,0,0,0,0-8ZM6,9A2,2,0,0,1,4,7,2,2,0,0,1,6,5V8a5.47,5.47,0,0,0,.09,1Zm13.41-.59A2,2,0,0,1,18,9h-.09A5.47,5.47,0,0,0,18,8V5a2,2,0,0,1,2,2A2,2,0,0,1,19.41,8.41Z" fill="currentColor"/></g></svg>
              </button>
              
            <button class="sidebar-icon" onclick="window.location.href='profile.html'">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 12C14.7614 12 17 9.76142 17 7C17 4.23858 14.7614 2 12 2C9.23858 2 7 4.23858 7 7C7 9.76142 9.23858 12 12 12Z" fill="currentColor"/>
                    <path d="M12 14.5C6.99 14.5 3 17.86 3 22H21C21 17.86 17.01 14.5 12 14.5Z" fill="currentColor"/>
                </svg>
            </button>
            
            <div class="sidebar-bottom">
                <button class="sidebar-icon" onclick="logout()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M9 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V5C3 4.46957 3.21071 3.96086 3.58579 3.58579C3.96086 3.21071 4.46957 3 5 3H9" stroke="currentColor" stroke-width="2"/>
                        <path d="M16 17L21 12L16 7" stroke="currentColor" stroke-width="2"/>
                        <path d="M21 12H9" stroke="currentColor" stroke-width="2"/>
                    </svg>
                </button>
            </div>
        </div>
        
        <!-- Main Content -->
        <div class="main-content">
            <!-- Header -->
            <div class="header">
                <div class="search-container">
                    <span class="search-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M11.5 21C16.7467 21 21 16.7467 21 11.5C21 6.25329 16.7467 2 11.5 2C6.25329 2 2 6.25329 2 11.5C2 16.7467 6.25329 21 11.5 21Z" stroke="#8F8F8F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M22 22L20 20" stroke="#8F8F8F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </span>
                    <input type="text" class="search-input" placeholder="Search">
                </div>
                
                <!-- Updated User Icon with Dropdown -->
                <div class="user-icon-container">
                    <div class="user-icon" onclick="toggleUserMenu()">
                        <div class="user-avatar">
                            <div class="avatar-placeholder" id="headerAvatar">
                                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M12 12C14.7614 12 17 9.76142 17 7C17 4.23858 14.7614 2 12 2C9.23858 2 7 4.23858 7 7C7 9.76142 9.23858 12 12 12Z" fill="#8F8F8F"/>
                                    <path d="M12 14.5C6.99 14.5 3 17.86 3 22H21C21 17.86 17.01 14.5 12 14.5Z" fill="#8F8F8F"/>
                                </svg>
                            </div>
                        </div>
                        <div class="status-indicator"></div>
                    </div>
                    
                    <!-- User Dropdown Menu -->
                    <div class="user-dropdown" id="userDropdown">
                        <div class="dropdown-item" onclick="window.location.href='profile.html'">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 12C14.7614 12 17 9.76142 17 7C17 4.23858 14.7614 2 12 2C9.23858 2 7 4.23858 7 7C7 9.76142 9.23858 12 12 12Z" fill="currentColor"/>
                                <path d="M12 14.5C6.99 14.5 3 17.86 3 22H21C21 17.86 17.01 14.5 12 14.5Z" fill="currentColor"/>
                            </svg>
                            See Profile
                        </div>
                        <div class="dropdown-item" onclick="logout()">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M9 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V5C3 4.46957 3.21071 3.96086 3.58579 3.58579C3.96086 3.21071 4.46957 3 5 3H9" stroke="currentColor" stroke-width="2"/>
                                <path d="M16 17L21 12L16 7" stroke="currentColor" stroke-width="2"/>
                                <path d="M21 12H9" stroke="currentColor" stroke-width="2"/>
                            </svg>
                            Logout
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Games Grid -->
            <div class="games-container">
                <div class="games-grid">
                    <!-- Game Card 1 -->
                    <a href="football.html" class="game-card">
                        <div class="game-image" style="background-image: url('../assets/gemleague.jpeg');">
                        </div>
                        <div class="game-title">Football League</div>
                    </a>
                    
                    <!-- Game Card 2 -->
                    <a href="tankwars.html" class="game-card">
                        <div class="game-image" style="background-image: url('../assets/tankwars.jpeg');">
                        </div>
                        <div class="game-title">Tank Wars</div>
                    </a>
                    
                    <!-- Game Card 3 -->
                    <a href="carcassonne.html" class="game-card">
                        <div class="game-image" style="background-image: url('../assets/carcassone.jpeg');">
                        </div>
                        <div class="game-title">Carcassonne</div>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/homepage.js"></script>
</body>
</html>
