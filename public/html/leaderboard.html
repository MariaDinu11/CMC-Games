<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - Gaming Platform</title>
    <link rel="stylesheet" href="../css/leaderboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="dashboard" class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="logo">
                <img src="../assets/logo.png" alt="Logo">
            </div>
            
            <button class="sidebar-icon" onclick="window.location.href='homepage.html'">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M21 6H3C2.45 6 2 6.45 2 7V17C2 17.55 2.45 18 3 18H21C21.55 18 22 17.55 22 17V7C22 6.45 21.55 6 21 6Z" stroke="currentColor" fill="currentColor" stroke-width="1.5"/>
                    <path d="M6 11H8" stroke="#1A1C24" stroke-width="1.5"/>
                    <path d="M7 10V12" stroke="#1A1C24" stroke-width="1.5"/>
                    <circle cx="17" cy="11" r="1" fill="#1A1C24"/>
                    <circle cx="15" cy="13" r="1" fill="#1A1C24"/>
                </svg>
            </button>
              
            <button class="sidebar-icon active">
                <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M18,3V2H6V3a4,4,0,1,0,0,8h.81A6,6,0,0,0,11,13.91V16H7.22l-1.5,6H18.28l-1.5-6H13V13.91A6,6,0,0,0,17.19,11H18a4,4,0,0,0,0-8ZM6,9A2,2,0,0,1,4,7,2,2,0,0,1,6,5V8a5.47,5.47,0,0,0,.09,1Zm13.41-.59A2,2,0,0,1,18,9h-.09A5.47,5.47,0,0,0,18,8V5a2,2,0,0,1,2,2A2,2,0,0,1,19.41,8.41Z" fill="currentColor"/>
                </svg>
            </button>
              
            <button class="sidebar-icon" onclick="window.location.href='profile.html'">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 12C14.7614 12 17 9.76142 17 7C17 4.23858 14.7614 2 12 2C9.23858 2 7 4.23858 7 7C7 9.76142 9.23858 12 12 12Z" fill="currentColor"/>
                    <path d="M12 14.5C6.99 14.5 3 17.86 3 22H21C21 17.86 17.01 14.5 12 14.5Z" fill="currentColor"/>
                </svg>
            </button>
            
            <div class="sidebar-bottom">
                <button class="sidebar-icon" onclick="logout()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M9 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V5C3 4.46957 3.21071 3.96086 3.58579 3.58579C3.96086 3.21071 4.46957 3 5 3H9" stroke="currentColor" stroke-width="2"/>
                        <path d="M16 17L21 12L16 7" stroke="currentColor" stroke-width="2"/>
                        <path d="M21 12H9" stroke="currentColor" stroke-width="2"/>
                    </svg>
                </button>
            </div>
        </div>
        
        <!-- Main Content -->
        <div class="main-content">
            <!-- Header -->
            <div class="header">
                <div class="page-title">
                    <h1>Leaderboard</h1>
                </div>
                
                <div class="user-icon-container">
                    <div class="user-icon" onclick="toggleUserMenu()">
                        <div class="user-avatar">
                            <div class="avatar-placeholder" id="headerAvatar">
                                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M12 12C14.7614 12 17 9.76142 17 7C17 4.23858 14.7614 2 12 2C9.23858 2 7 4.23858 7 7C7 9.76142 9.23858 12 12 12Z" fill="#8F8F8F"/>
                                    <path d="M12 14.5C6.99 14.5 3 17.86 3 22H21C21 17.86 17.01 14.5 12 14.5Z" fill="#8F8F8F"/>
                                </svg>
                            </div>
                        </div>
                        <div class="status-indicator"></div>
                    </div>
                    
                    <!-- User Dropdown Menu -->
                    <div class="user-dropdown" id="userDropdown">
                        <div class="dropdown-item" onclick="window.location.href='profile.html'">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 12C14.7614 12 17 9.76142 17 7C17 4.23858 14.7614 2 12 2C9.23858 2 7 4.23858 7 7C7 9.76142 9.23858 12 12 12Z" fill="currentColor"/>
                                <path d="M12 14.5C6.99 14.5 3 17.86 3 22H21C21 17.86 17.01 14.5 12 14.5Z" fill="currentColor"/>
                            </svg>
                            Vezi Profilul
                        </div>
                        <div class="dropdown-item" onclick="logout()">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M9 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V5C3 4.46957 3.21071 3.96086 3.58579 3.58579C3.96086 3.21071 4.46957 3 5 3H9" stroke="currentColor" stroke-width="2"/>
                                <path d="M16 17L21 12L16 7" stroke="currentColor" stroke-width="2"/>
                                <path d="M21 12H9" stroke="currentColor" stroke-width="2"/>
                            </svg>
                            Logout
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Leaderboard Content -->
            <div class="leaderboard-container">
                <!-- Game Filter -->
                <div class="game-filter">
                    <h3>Selectează Jocul:</h3>
                    <div class="filter-buttons" id="gameFilterButtons">
                        <button class="filter-btn active" data-game="all">Toate Jocurile</button>
                        <!-- Game buttons will be loaded by JS -->
                    </div>
                </div>
                
                <!-- Top 3 Podium -->
                <div class="podium-section" id="podiumSection">
                    <div class="podium">
                        <!-- Second Place -->
                        <div class="podium-place second-place" id="secondPlace">
                            <div class="podium-rank">2</div>
                            <div class="podium-avatar">
                                <div class="avatar-podium">--</div>
                            </div>
                            <div class="podium-username">Loading...</div>
                            <div class="podium-rating">0</div>
                            <div class="podium-base"></div>
                        </div>
                        
                        <!-- First Place -->
                        <div class="podium-place first-place" id="firstPlace">
                            <div class="podium-crown">👑</div>
                            <div class="podium-rank">1</div>
                            <div class="podium-avatar">
                                <div class="avatar-podium">--</div>
                            </div>
                            <div class="podium-username">Loading...</div>
                            <div class="podium-rating">0</div>
                            <div class="podium-base"></div>
                        </div>
                        
                        <!-- Third Place -->
                        <div class="podium-place third-place" id="thirdPlace">
                            <div class="podium-rank">3</div>
                            <div class="podium-avatar">
                                <div class="avatar-podium">--</div>
                            </div>
                            <div class="podium-username">Loading...</div>
                            <div class="podium-rating">0</div>
                            <div class="podium-base"></div>
                        </div>
                    </div>
                </div>
                
                <!-- Full Leaderboard Table -->
                <div class="leaderboard-table-section">
                    <div class="table-header">
                        <h3>Clasament Complet</h3>
                        <div class="table-controls">
                            <input type="text" id="searchPlayer" placeholder="Caută jucător..." class="search-input">
                        </div>
                    </div>
                    
                    <div class="leaderboard-table">
                        <table>
                            <thead>
                                <tr>
                                    <th>Rank</th>
                                    <th>Jucător</th>
                                    <th>Rating</th>
                                    <th>Jocuri</th>
                                    <th>Victorii</th>
                                    <th>Rata</th>
                                    <th>Ultima Activitate</th>
                                </tr>
                            </thead>
                            <tbody id="leaderboardTableBody">
                                <tr>
                                    <td colspan="7" class="loading">Se încarcă clasamentul...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    
                    <!-- Pagination -->
                    <div class="pagination" id="pagination">
                        <!-- Pagination buttons will be generated by JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/leaderboard.js"></script>
</body>
</html>
